<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search: Present Perfect - Tourism & Gastronomy</title>
    <style>
        :root {
            --navy: #0A192F;
            --turquoise: #00BCD4;
            --orange: #FF9800;
            --light-bg: #f4f7f6;
            --found-color: #009688;
            --select-color: rgba(255, 152, 0, 0.4);
        }

        body {
            font-family: 'Poppins', 'Calibri', sans-serif;
            background-color: var(--light-bg);
            color: var(--navy);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
        }

        h1 {
            color: var(--navy);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin: 0;
            border-bottom: 3px solid var(--turquoise);
            display: inline-block;
            padding-bottom: 5px;
        }

        h2 {
            color: var(--turquoise);
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin: 10px 0;
            font-weight: 500;
        }

        .instructions {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            max-width: 600px;
            text-align: center;
            font-size: 0.95rem;
            border-left: 5px solid var(--orange);
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .grid-wrapper {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            flex: 1 1 400px;
            max-width: 600px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 2px;
            user-select: none;
            touch-action: none; /* Prevents scrolling while dragging on mobile */
        }

        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-weight: bold;
            font-size: clamp(0.7rem, 2.5vw, 1.2rem);
            color: var(--navy);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .cell:hover {
            background-color: #f0f8ff;
            transform: scale(1.05);
        }

        .cell.selecting {
            background-color: var(--select-color);
            color: var(--navy);
            transform: scale(1.1);
            z-index: 10;
            border-color: var(--orange);
        }

        .cell.found {
            background-color: var(--found-color);
            color: white;
            border-color: var(--found-color);
            transform: scale(1.0);
        }

        .words-wrapper {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            flex: 1 1 250px;
            max-width: 300px;
            align-self: flex-start;
        }

        .words-wrapper h3 {
            margin-top: 0;
            color: var(--navy);
            text-align: center;
            border-bottom: 2px solid var(--turquoise);
            padding-bottom: 10px;
        }

        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .word-list li {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--navy);
            padding: 5px;
            text-align: center;
            background: #f8f9fa;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .word-list li.found {
            text-decoration: line-through;
            color: var(--found-color);
            background: #e0f2f1;
        }

        .btn-reset {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--orange);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: block;
            width: 100%;
        }

        .btn-reset:hover {
            background-color: #e68900;
        }

        @media (max-width: 600px) {
            .word-list {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>✈️ Present Perfect Word Search 🍽️</h1>
        <h2>Tourism & Gastronomy Vocabulary</h2>
    </header>

    <div class="instructions">
        <strong>Instructions:</strong> Find the 15 hidden words related to Tourism and Gastronomy. 
        Words can be hidden <strong>horizontally, vertically, or diagonally</strong>. 
        Click and drag (or swipe on mobile) to select the letters.
    </div>

    <div class="game-container">
        <div class="grid-wrapper">
            <div class="grid" id="puzzleGrid"></div>
        </div>

        <div class="words-wrapper">
            <h3>🔍 Find these words:</h3>
            <ul class="word-list" id="wordList"></ul>
            <button class="btn-reset" onclick="initGame()">🔄 New Game</button>
        </div>
    </div>

    <script>
        const WORDS = [
            'TOURIST', 'RESORT', 'MUSEUM', 'PASSPORT', 'AIRPORT', 
            'HOTEL', 'SEAFOOD', 'CUISINE', 'RECIPE', 'WAITER', 
            'CUSTOMER', 'DESSERT', 'APPETIZER', 'TRAVEL', 'CHEF'
        ];
        
        const GRID_SIZE = 15;
        const DIRECTIONS = [
            [0, 1],   // Right
            [1, 0],   // Down
            [1, 1],   // Diagonal Down-Right
            [-1, 1]   // Diagonal Up-Right
        ];

        let grid = [];
        let remainingWords = [];
        let isSelecting = false;
        let startCell = null;
        let selectedCells = [];

        function initGame() {
            grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(''));
            remainingWords = [...WORDS];
            
            // Place words
            WORDS.forEach(word => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 200) {
                    const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);
                    
                    if (canPlace(word, row, col, dir)) {
                        doPlace(word, row, col, dir);
                        placed = true;
                    }
                    attempts++;
                }
            });

            // Fill empty spaces
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                    }
                }
            }

            renderGrid();
            renderWordList();
        }

        function canPlace(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const r = row + i * dir[0];
                const c = col + i * dir[1];
                if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
                if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
            }
            return true;
        }

        function doPlace(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const r = row + i * dir[0];
                const c = col + i * dir[1];
                grid[r][c] = word[i];
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('puzzleGrid');
            gridEl.innerHTML = '';
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grid[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderWordList() {
            const listEl = document.getElementById('wordList');
            listEl.innerHTML = '';
            WORDS.forEach(word => {
                const li = document.createElement('li');
                li.textContent = word;
                li.dataset.word = word;
                listEl.appendChild(li);
            });
        }

        // Interaction Logic
        const gridEl = document.getElementById('puzzleGrid');

        gridEl.addEventListener('pointerdown', (e) => {
            if (e.target.classList.contains('cell')) {
                isSelecting = true;
                startCell = e.target;
                selectedCells = [startCell];
                updateSelection();
                e.preventDefault();
            }
        });

        gridEl.addEventListener('pointermove', (e) => {
            if (!isSelecting) return;
            const target = document.elementFromPoint(e.clientX, e.clientY);
            
            if (target && target.classList.contains('cell')) {
                const startR = parseInt(startCell.dataset.row);
                const startC = parseInt(startCell.dataset.col);
                const currR = parseInt(target.dataset.row);
                const currC = parseInt(target.dataset.col);

                const dr = currR - startR;
                const dc = currC - startC;

                // Check if it's a valid straight or 45-degree diagonal line
                if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                    selectedCells = getCellsInLine(startR, startC, currR, currC);
                    updateSelection();
                }
            }
            e.preventDefault();
        });

        document.addEventListener('pointerup', () => {
            if (isSelecting) {
                checkSelection();
                isSelecting = false;
                selectedCells = [];
                updateSelection();
            }
        });

        function getCellsInLine(r1, c1, r2, c2) {
            const cells = [];
            const stepR = Math.sign(r2 - r1);
            const stepC = Math.sign(c2 - c1);
            const steps = Math.max(Math.abs(r2 - r1), Math.abs(c2 - c1));

            for (let i = 0; i <= steps; i++) {
                const r = r1 + i * stepR;
                const c = c1 + i * stepC;
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                if (cell) cells.push(cell);
            }
            return cells;
        }

        function updateSelection() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selecting'));
            selectedCells.forEach(c => c.classList.add('selecting'));
        }

        function checkSelection() {
            if (selectedCells.length === 0) return;
            
            const word = selectedCells.map(c => c.textContent).join('');
            const reverseWord = word.split('').reverse().join('');

            if (remainingWords.includes(word) || remainingWords.includes(reverseWord)) {
                const foundWord = remainingWords.includes(word) ? word : reverseWord;
                remainingWords = remainingWords.filter(w => w !== foundWord);
                
                selectedCells.forEach(c => {
                    c.classList.remove('selecting');
                    c.classList.add('found');
                });

                const li = document.querySelector(`li[data-word="${foundWord}"]`);
                if (li) li.classList.add('found');

                if (remainingWords.length === 0) {
                    setTimeout(() => {
                        alert('🎉 ¡Felicidades! / Congratulations! 🎉\nHas encontrado todas las palabras del vocabulario de Turismo y Gastronomía.');
                    }, 300);
                }
            }
        }

        // Initialize on load
        window.onload = initGame;
    </script>
</body>
</html>
